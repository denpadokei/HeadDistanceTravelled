name: Build and Merge

on:
  pull_request:
    paths:
      - .github/workflows/build-and-merge.yml
      - HeadDistanceTravelled/**
  push:
    branches: [main]
    paths:
      - .github/workflows/build-and-merge.yml
      - HeadDistanceTravelled/**

jobs:
  build:
    name: Build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Beat Saber
        uses: nicoco007/setup-beat-saber@v1
        with:
          project-path: ${{ github.workspace }}\HeadDistanceTravelled\HeadDistanceTravelled.csproj

      - name: Build Release
        id: build-release
        run: dotnet build ${{ github.workspace }}\HeadDistanceTravelled\HeadDistanceTravelled.csproj -c Release

      - name: Upload Release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build-release.outputs.artifact-name }}
          path: ${{ steps.build-release.outputs.artifact-path }}

  merge:
    name: Merge
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR
        run: gh pr merge --squash "${{ github.event.pull_request.number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
