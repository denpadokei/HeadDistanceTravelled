name: Build and Release

on:
  # 手动実行は release ジョブの条件 (タグ / main への push) に引っかからないので、
  # ビルド確認用の手動実行はリリースを作成しない。
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-and-release.yml
      - HeadDistanceTravelled/**
  push:
    # main への push: ビルドして v<manifest version> タグのリリースを作成する。
    # タグの push: そのタグが指すコミットをビルドし、同じタグのリリースに成果物を添付する
    # (paths フィルタはタグ push では評価されない)。
    # なお GITHUB_TOKEN で作成したタグはワークフローを起動しないため、main への push では
    # その実行自身がタグ作成とリリース添付まで行う。
    branches: [main]
    tags:
      - 'v*'
      - '[0-9]*'
    paths:
      - .github/workflows/build-and-release.yml
      - HeadDistanceTravelled/**

jobs:
  build:
    name: Build
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      zip-name: ${{ steps.package.outputs.zip-name }}
      version: ${{ steps.manifest.outputs.version }}
      game-version: ${{ steps.manifest.outputs.game-version }}
      # リリース先のタグ。タグ push ならそのタグ名、main への push なら v<manifest version>。
      tag: ${{ steps.manifest.outputs.tag }}
      # 実際にビルドしたコミット。リリースの --target に使う。
      commit: ${{ steps.manifest.outputs.commit }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # タグ push のときはタグが指すコミット (github.sha) をビルドする。
          # ブランチ push / PR でもそのイベントのコミットになる。
          ref: ${{ github.sha }}

      - name: Read manifest
        id: manifest
        shell: pwsh
        run: |
          $manifest = Get-Content 'HeadDistanceTravelled/manifest.json' -Raw | ConvertFrom-Json

          # タグ push ではタグ名をそのままリリース先にする。main への push では
          # manifest のバージョンから v 付きタグを決める (従来の挙動)。
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = 'v' + $manifest.version
          }

          "version=$($manifest.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "game-version=$($manifest.gameVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "commit=$($env:GITHUB_SHA)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # BeatMods は 2026-10-24 の tRPC 基盤 API (v2) への移行で /api/versions を廃止し、
      # 当時 nicoco007/setup-beat-saber@v1 が 404 になったため参照ファイルを自前で
      # 組み立てていた。同アクションは 2026-11-01 に BeatMods API v3 へ対応したので、
      # 標準のセットアップに戻す。
      # このプロジェクトは依存を csproj の DependsOn 項目ではなく manifest.json に持つため、
      # アクションが読む game-version と additional-dependencies を明示する
      # (BSIPA / SiraUtil は manifest.json、BSML は csproj の参照に合わせたもの)。
      # このアクションは範囲内で最も低いバージョンを選ぶので、1.40.8 に対応した最小の
      # バージョンを指定する (BSIPA 4.3.5 は 1.40.8 に未対応、4.3.6 が対応済み)。
      - name: Set up Beat Saber
        uses: nicoco007/setup-beat-saber@v1
        with:
          project-path: ${{ github.workspace }}\HeadDistanceTravelled\HeadDistanceTravelled.csproj
          game-version: ${{ steps.manifest.outputs.game-version }}
          additional-dependencies: |
            {
              "BSIPA": "^4.3.6",
              "SiraUtil": "^3.2.0",
              "BeatSaberMarkupLanguage": "^1.12.5"
            }

      - name: Build Release
        id: build-release
        shell: pwsh
        run: |
          # csproj は ..\Refs があるときだけ BeatSaberDir を使うので、CI では明示的に渡す。
          dotnet build ${{ github.workspace }}\HeadDistanceTravelled\HeadDistanceTravelled.csproj -c Release -p:BeatSaberDir="$env:BeatSaberDir" -p:GameDirectory="$env:BeatSaberDir" -p:DisableCopyToPlugins=true

      - name: Pack release zip
        id: package
        shell: pwsh
        run: |
          # BSMT は CI では zip を作らない (DisableZipRelease=true) ので、artifact ディレクトリから
          # リリース用の zip を作る。
          $artifact = '${{ steps.build-release.outputs.artifactpath }}'
          $zip = Join-Path $env:RUNNER_TEMP ('{0}.zip' -f '${{ steps.build-release.outputs.filename }}')
          Compress-Archive -Path (Join-Path $artifact '*') -DestinationPath $zip -Force
          'zip-name={0}' -f '${{ steps.build-release.outputs.filename }}' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          'zip-path={0}' -f $zip | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip-name }}
          path: ${{ steps.package.outputs.zip-path }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    # main への push (タグ作成) とタグの push のときだけリリースする。
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - name: Download release zip
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.zip-name }}
          path: release

      - name: Publish GitHub release
        shell: bash
        run: |
          # チェックアウトしないので gh にリポジトリを明示する。
          repo='${{ github.repository }}'
          tag='${{ needs.build.outputs.tag }}'
          sha='${{ needs.build.outputs.commit }}'
          zip="release/${{ needs.build.outputs.zip-name }}.zip"
          notes="HeadDistanceTravelled ${{ needs.build.outputs.version }} for Beat Saber ${{ needs.build.outputs.game-version }} (${sha:0:7})."

          # セマンティックバージョンのプレリリース (v3.0.1-rc1 など) は prerelease として作成し、
          # Latest バッジを通常リリースから奪わないようにする。
          pre=()
          if [[ "$tag" =~ ^[vV]?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            pre=(--prerelease --latest=false)
          fi

          # タグが既にある場合は、そのタグが指すコミットとビルドしたコミットを突き合わせる。
          # 一致しないときは成果物がタグのコミットと食い違うのでリリースしない
          # (manifest のバージョンを上げ忘れて main に push した場合など)。
          tag_sha=$(gh api "repos/$repo/commits/$tag" --jq .sha 2>/dev/null || true)
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$sha" ]; then
            echo "::warning::tag '$tag' points to $tag_sha but this run built $sha; skipping release to keep the asset matched to the tagged commit."
            exit 0
          fi

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$repo" --title "$tag" "${pre[@]}"
          elif [ -n "$tag_sha" ]; then
            # タグ push で起動した場合など、タグが既に存在するときはそのタグに紐づける。
            gh release create "$tag" --repo "$repo" --title "$tag" --notes "$notes" --verify-tag "${pre[@]}"
          else
            # main への push では、実際にビルドしたコミットを指すタグを新規作成する。
            gh release create "$tag" --repo "$repo" --title "$tag" --notes "$notes" --target "$sha" "${pre[@]}"
          fi
          gh release upload "$tag" "$zip" --repo "$repo" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
